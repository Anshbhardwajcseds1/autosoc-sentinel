services:
  - type: web
    name: autosoc-sentinel-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK_MODE
        value: "true"
      - key: LLM_MOCK_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: "sqlite:///./autosoc.db"
